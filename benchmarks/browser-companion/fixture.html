<!doctype html><html lang="en"><meta charset="utf-8"><title>Preview workbench</title>
<style>body{font:17px system-ui;background:#0b1320;color:#e9f2ff;margin:0;padding:48px}main{max-width:980px;margin:auto}header{color:#81b6ff;font:12px monospace;letter-spacing:2px}h1{font-size:38px}section{border:1px solid #355277;padding:28px;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:30px}label{display:block;margin:16px 0}input,select,button{font:inherit;padding:12px;border-radius:5px;border:1px solid #4273b0;background:#15283f;color:#e9f2ff}input,select{display:block;margin-top:8px}button{cursor:pointer;background:#1458c5;margin-right:10px}#result{margin:24px 0;padding:24px;border:1px solid #355277}#result strong{color:#8acbff}p{line-height:1.6}</style>
<main><header>SYSTEM ONE / ORIGINAL TEST FIXTURE</header><h1>Preview workbench</h1><p>Create a preview. This fixture does not send a message, publish a site or charge an account.</p>
<section><div><label>Project name<input id="name" autocomplete="off"></label><label>Mode<select id="mode"><option value="dark">Dark</option><option value="light">Light</option><option value="contrast">High contrast</option></select></label><button id="save">Save preview</button><button id="clear">Clear form</button></div><div><h2>Saved preview</h2><div id="result">No preview saved.</div><p>The saved record appears here after you choose Save preview.</p></div></section>
</main><script>const nameField=document.querySelector('#name'),mode=document.querySelector('#mode'),result=document.querySelector('#result');const params=new URLSearchParams(location.search);if(params.has('initial'))nameField.value=params.get('initial');if(params.has('mode'))mode.value=params.get('mode');document.querySelector('#save').onclick=async()=>{if(!nameField.value){result.textContent='Enter a project name.';return;}const record={name:nameField.value,mode:mode.value};await fetch('/save',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(record)});result.textContent='Saved preview: '+record.name+'; mode: '+record.mode+'.';};document.querySelector('#clear').onclick=()=>{nameField.value='';mode.value='dark';result.textContent='No preview saved.';};</script></html>
